[project]
name = "jeju-data-agent"
version = "0.1.0"
description = "제주 데이터 길잡이: 제주데이터허브·제주빅데이터센터 데이터 분석 AI Agent"
readme = "README.md"
authors = [
    { name = "Yunsup Sim", email = "dev@ethansup.net" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.48.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "streamlit>=1.67.0",
]

[project.scripts]
jeju-data-agent = "jeju_data_agent:main"

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
